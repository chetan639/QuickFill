<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: system-ui, sans-serif; }
    h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; }
    input, textarea, button { width: 100%; margin-bottom: 10px; box-sizing: border-box; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; }
    textarea { resize: vertical; height: 80px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #0056b3; }
    
    #cancel { background: #6c757d; display: none; }
    #cancel:hover { background: #5a6268; }

    .snippet { border: 1px solid #eee; padding: 10px; margin-bottom: 8px; border-radius: 6px; background: #f9f9f9; }
    .snippet-title { font-weight: bold; margin-bottom: 4px; color: #202124; }
    .snippet-text { font-size: 12px; color: #555; white-space: pre-wrap; margin-bottom: 8px; max-height: 45px; overflow: hidden; text-overflow: ellipsis; }
    
    .snippet-actions { display: flex; gap: 6px; }
    .btn-small { padding: 4px 10px; font-size: 12px; width: auto; margin-bottom: 0; }
    .btn-edit { background: #ffc107; color: #000; }
    .btn-edit:hover { background: #e0a800; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-delete:hover { background: #c82333; }
  </style>
</head>
<body>
  <h3 id="form-title">Add New Snippet</h3>
  <input type="text" id="title" placeholder="Shortcut Name (e.g., Email)">
  <textarea id="text" placeholder="The text to insert..."></textarea>
  <button id="save">Save Snippet</button>
  <button id="cancel">Cancel Edit</button>
  
  <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
  
  <h3>Your Snippets</h3>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
